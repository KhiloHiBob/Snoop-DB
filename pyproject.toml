[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "db-dog"
version = "0.1.0"
description = "A read-only AI database agent: ask in plain English, get SQL, safety checks and a table back."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "sqlglot>=25.0",
  "anthropic>=0.40",
  "psycopg[binary]>=3.1",
  "pymysql>=1.1",
  "redis>=5.0",
  "pymongo>=4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
db-dog = "db_dog.__main__:main"

[tool.setuptools.packages.find]
include = ["db_dog*"]

[tool.setuptools.package-data]
db_dog = ["knowledge/*.md", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
