[project]
name = "snoop-db"
version = "0.1.0"
description = "A schema-grounded, read-only database chat agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.4",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.8",
    "sqlglot==30.31.0",
    "uvicorn==0.54.0",
]

[project.scripts]
snoop-db = "snoop_db:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
