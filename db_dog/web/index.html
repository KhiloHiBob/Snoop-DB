<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>db-dog</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B6%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f24; --muted: #667085; --line: #e3e6eb;
    --accent: #0f766e; --accent-ink: #ffffff; --soft: #eef6f5;
    --prod: #b42318; --prod-bg: #fdecea; --ok-bg: #e7f5ec; --ok: #1a7f43; --warn-bg: #fff6e0; --warn: #8a5a00;
    --code: #f0f2f5; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --panel: #171b21; --ink: #e8eaee; --muted: #98a2b3; --line: #2a303a;
      --accent: #2dd4bf; --accent-ink: #062b27; --soft: #14282a;
      --prod: #ffb4a8; --prod-bg: #3a1a17; --ok-bg: #12301f; --ok: #6ee7a0; --warn-bg: #33270a; --warn: #fcd34d;
      --code: #1f242c; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1216; --panel: #171b21; --ink: #e8eaee; --muted: #98a2b3; --line: #2a303a;
    --accent: #2dd4bf; --accent-ink: #062b27; --soft: #14282a;
    --prod: #ffb4a8; --prod-bg: #3a1a17; --ok-bg: #12301f; --ok: #6ee7a0; --warn-bg: #33270a; --warn: #fcd34d;
    --code: #1f242c; --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 10px 16px; background: var(--panel);
           border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
  header h1 span { color: var(--accent); }
  .spacer { flex: 1; }
  select, input[type=text], textarea, button { font: inherit; color: inherit; }
  select, .ghost { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; cursor: pointer; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
           background: var(--ok-bg); color: var(--ok); }
  .badge.prod { background: var(--prod-bg); color: var(--prod); }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
  .empty h2 { color: var(--ink); margin-bottom: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .msg-user { align-self: flex-end; max-width: 80%; background: var(--accent); color: var(--accent-ink); padding: 8px 13px;
              border-radius: 14px 14px 4px 14px; white-space: pre-wrap; word-break: break-word; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); }
  .card .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; color: var(--muted); font-size: 12.5px; }
  .summary { margin: 4px 0 10px; word-break: break-word; }
  .summary code, .sql { background: var(--code); border-radius: 6px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
  .summary code { padding: 1px 5px; }
  .note { border-radius: 8px; padding: 6px 10px; font-size: 13px; margin: 6px 0; background: var(--warn-bg); color: var(--warn); }
  .note.err { background: var(--prod-bg); color: var(--prod); }
  .result { border: 1px solid var(--line); border-radius: 10px; margin-top: 10px; overflow: hidden; }
  .result-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; background: var(--soft); }
  .result-head b { flex: 1; min-width: 120px; }
  .result-head small { color: var(--muted); }
  .result-head input { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 8px; width: 150px; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 12.5px; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .tablewrap { max-height: 420px; overflow: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
  th { position: sticky; top: 0; background: var(--panel); cursor: pointer; user-select: none; z-index: 1; }
  th.sorted::after { content: attr(data-dir); color: var(--accent); margin-left: 4px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.null { color: var(--muted); font-style: italic; }
  tbody tr:hover { background: var(--soft); }
  .stat { padding: 18px 14px; }
  .stat .v { font-size: 34px; font-weight: 700; color: var(--accent); word-break: break-all; }
  .stat .k { color: var(--muted); font-size: 13px; }
  details { margin-top: 10px; font-size: 13px; }
  summary { cursor: pointer; color: var(--muted); }
  .sql { display: block; padding: 8px 10px; margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
  .steps div { padding: 2px 0; color: var(--muted); }
  .dots::after { content: ""; animation: d 1.2s steps(4) infinite; }
  @keyframes d { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  footer { padding: 10px 16px 14px; background: var(--bg); }
  form { max-width: 1100px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; resize: none; min-height: 46px; max-height: 160px; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line);
             background: var(--panel); }
  textarea:focus, select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #send { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 0 20px; height: 46px; font-weight: 600; cursor: pointer; }
  #send.stop { background: var(--prod); color: #fff; }
  .hint { max-width: 1100px; margin: 6px auto 0; color: var(--muted); font-size: 12px; }
  .compose { display: flex; align-items: flex-end; gap: 12px; max-width: 1100px; margin: 0 auto; }
  .compose form { flex: 1; min-width: 0; margin: 0; max-width: none; }
  .dog { width: 96px; height: 70px; flex: none; overflow: visible; }
  .dog .fur { fill: #c98a4b; } .dog .ear { fill: #8a5a2b; } .dog .ink { fill: #1b1f24; } .dog .tongue { fill: #f06292; }
  .dog .tail { transform-origin: 8px 24px; animation: wag .45s ease-in-out infinite alternate; }
  .dog .eye { transform-origin: center; transform-box: fill-box; animation: blink 4s infinite; }
  .dog .tongue { transform-origin: 40px 28px; animation: pant 1.2s ease-in-out infinite; }
  .dog-wrap { display: inline-flex; animation: bob 2.4s ease-in-out infinite; }
  footer.busy .dog-wrap { animation: run .35s ease-in-out infinite; }
  footer.busy .dog .tail { animation-duration: .15s; }
  @keyframes wag { from { transform: rotate(-22deg); } to { transform: rotate(28deg); } }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  @keyframes pant { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.35); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @keyframes run { 0%, 100% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(3px, -4px) rotate(-3deg); } }
  .app { flex: 1; display: flex; min-height: 0; }
  .chat { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #threads { width: 250px; flex: none; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); }
  .th-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; font-weight: 600; border-bottom: 1px solid var(--line); }
  .plug { width: 30px; height: 30px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 20px; line-height: 1; cursor: pointer; }
  #tlist { flex: 1; overflow-y: auto; margin: 0; padding: 6px; list-style: none; }
  .th { display: flex; align-items: center; gap: 6px; padding: 8px 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .th:hover { background: var(--soft); }
  .th.active { background: var(--soft); border-color: var(--accent); }
  .th .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
  .th.running .dot { background: var(--ok); animation: pulse 1s infinite; }
  .th.stopped .dot { background: var(--warn); }
  .th .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
  .th .ic { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 2px 5px; border-radius: 5px; font-size: 13px; }
  .th .ic:hover { color: var(--prod); background: var(--prod-bg); }
  .th .ic[hidden] { display: none; }
  .msg-user .edit { margin-left: 10px; border: 0; background: transparent; color: inherit; opacity: .7; cursor: pointer; font-size: 12px; text-decoration: underline; }
  .msg-user .edit:hover { opacity: 1; }
  .play { position: relative; height: 64px; width: 100%; max-width: 320px; overflow: hidden; margin-top: 8px; }
  .play svg { position: absolute; bottom: 0; left: 0; width: 70px; height: 51px; overflow: visible; animation: chase 2.4s ease-in-out infinite alternate; }
  .play .ball { position: absolute; bottom: 2px; width: 16px; height: 16px; border-radius: 50%; background: #e5484d; box-shadow: inset -3px -3px 0 rgba(0,0,0,.18);
                animation: bounce 2.4s ease-in-out infinite alternate; left: 190px; }
  .play .fur { fill: #c98a4b; } .play .ear { fill: #8a5a2b; } .play .ink { fill: #1b1f24; } .play .tongue { fill: #f06292; }
  .play .tail { transform-origin: 8px 24px; animation: wag .18s ease-in-out infinite alternate; }
  .play .leg { transform-box: fill-box; transform-origin: top center; animation: step .3s ease-in-out infinite alternate; }
  .play .leg.b { animation-delay: -.15s; }
  @keyframes chase { 0% { transform: translateX(0); } 100% { transform: translateX(150px); } }
  @keyframes bounce { 0% { transform: translate(0, 0); } 25% { transform: translate(-40px, -22px); } 50% { transform: translate(-40px, 0); } 75% { transform: translate(-90px, -18px); } 100% { transform: translate(-190px, 0); } }
  @keyframes step { from { transform: rotate(-25deg); } to { transform: rotate(25deg); } }
  @media (prefers-reduced-motion: reduce) { .play *, .play svg, .play .ball { animation: none !important; } }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (max-width: 760px) { #threads { width: 150px; } }
  @media (prefers-reduced-motion: reduce) { .dog *, .dog-wrap { animation: none !important; } }
  @media (max-width: 600px) { .dog { width: 64px; height: 47px; } header { padding: 10px 16px; } main { padding: 12px 16px; } footer { padding: 8px 16px 12px; } .msg-user { max-width: 92%; } }
</style>
</head>
<body>
<header>
  <h1>DB<span>-Dog</span></h1>
  <label class="toggle">Environment
    <select id="env"><option value="auto">Auto (from question)</option></select>
  </label>
  <label class="toggle" title="By default the AI only sees schemas. Turn on to let it read result rows (never for prod unless enabled in config).">
    <input type="checkbox" id="rows"> AI may read rows
  </label>
  <span class="spacer"></span>
  <button class="ghost btn" id="api" title="API address">API</button>
  <button class="ghost btn" id="clear" title="Clear this thread">Clear</button>
</header>

<div class="app">
<aside id="threads" aria-label="Threads">
  <div class="th-head"><span>Threads</span><button class="plug" id="newthread" type="button" title="New thread" aria-label="New thread">+</button></div>
  <ul id="tlist"></ul>
  <div id="storewarn" class="note" hidden style="margin:8px;font-size:12px">Threads are not being saved (store offline). Run <code>docker compose up -d threads-db</code>.</div>
</aside>
<div class="chat">
<main id="main"></main>

<footer id="top">
  <div class="compose">
  <span class="dog-wrap" aria-hidden="true"><svg class="dog"  viewBox="0 0 60 44">
    <path class="fur tail" d="M9 24 Q-2 14 3 6 Q8 14 14 22Z"/>
    <rect class="fur" x="8" y="22" width="30" height="14" rx="7"/>
    <rect class="fur" x="12" y="32" width="5" height="10" rx="2.5"/><rect class="fur" x="30" y="32" width="5" height="10" rx="2.5"/>
    <circle class="fur" cx="42" cy="18" r="11"/><ellipse class="fur" cx="52" cy="22" rx="7" ry="5"/>
    <path class="ear" d="M34 10 Q30 2 37 5 Q40 8 40 12Z"/><path class="ear" d="M46 8 Q52 1 52 9 Q50 12 47 12Z"/>
    <circle class="ink" cx="58" cy="21" r="2"/>
    <ellipse class="ink eye" cx="44" cy="16" rx="1.8" ry="2.2"/>
    <path class="tongue" d="M50 26 q2 7 4 0Z"/>
  </svg></span>
  <form id="form">
    <textarea id="q" rows="1" placeholder="Ask about any table or data… e.g. “list tables that have a company_id column”" autofocus></textarea>
    <button id="send" type="submit">Ask</button>
  </form>
  </div>
  <div class="hint">Read-only in every environment. Enter to send, Shift+Enter for a new line. The environment used is always shown on the answer.</div>
</footer>
</div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const main = $('main'), q = $('q'), send = $('send');
  let log = null;   // the active thread's message container
  const store = {
    get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* storage unavailable */ } },
  };
  let base = store.get('dbdog.api', location.protocol === 'file:' ? 'http://127.0.0.1:8137' : '');

  const EXAMPLES = [
    'List all tables in the demo database',
    'Describe the employees table',
    'How many employees per department?',
    'Show the 10 most recent hires',
  ];

  function el(tag, props = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null) e.append(k);
    return e;
  }
  const scroll = () => { main.scrollTop = main.scrollHeight; };

  // ---- minimal, safe inline markdown: **bold** and `code` (everything else is plain text)
  function mdInline(text) {
    const frag = document.createDocumentFragment();
    String(text).split(/(\*\*[^*]+\*\*|`[^`]+`)/g).forEach((part) => {
      if (/^\*\*[^*]+\*\*$/.test(part)) frag.append(el('b', { text: part.slice(2, -2) }));
      else if (/^`[^`]+`$/.test(part)) frag.append(el('code', { text: part.slice(1, -1) }));
      else frag.append(document.createTextNode(part));
    });
    return frag;
  }

  const fmt = (v) => (v !== null && typeof v === 'object') ? JSON.stringify(v) : String(v);
  const isNum = (v) => typeof v === 'number' || (typeof v === 'string' && v !== '' && /^-?\d+(\.\d+)?$/.test(v));

  function csvOf(columns, rows) {
    const esc = (v) => { const s = v === null ? '' : fmt(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    return [columns.map(esc).join(','), ...rows.map((r) => r.map(esc).join(','))].join('\n');
  }

  function renderTable(res) {
    const { columns, rows } = res;
    let view = rows.slice(), sortCol = -1, dir = 1, term = '';
    const tbody = el('tbody'), thead = el('tr');
    const count = el('small');

    const draw = () => {
      let r = view;
      if (term) r = r.filter((row) => row.some((c) => c !== null && fmt(c).toLowerCase().includes(term)));
      if (sortCol >= 0) {
        r = r.slice().sort((a, b) => {
          const x = a[sortCol], y = b[sortCol];
          if (x === null) return 1; if (y === null) return -1;
          return (isNum(x) && isNum(y) ? Number(x) - Number(y) : fmt(x).localeCompare(fmt(y))) * dir;
        });
      }
      tbody.replaceChildren(...r.map((row) => el('tr', {}, row.map((c) => {
        const td = el('td', { text: c === null ? 'null' : fmt(c) });
        if (c === null) td.className = 'null'; else if (isNum(c)) td.className = 'num';
        if (c !== null && fmt(c).length > 40) td.title = fmt(c).slice(0, 600);
        return td;
      }))));
      count.textContent = `${r.length}${r.length !== rows.length ? ' of ' + rows.length : ''} row${rows.length === 1 ? '' : 's'}`
        + (res.truncated ? ' (truncated)' : '') + (res.elapsed_ms ? ` · ${res.elapsed_ms} ms` : '');
    };

    columns.forEach((c, i) => thead.append(el('th', { text: c, onclick: () => {
      dir = sortCol === i ? -dir : 1; sortCol = i;
      thead.querySelectorAll('th').forEach((t) => { t.classList.remove('sorted'); t.removeAttribute('data-dir'); });
      thead.children[i].classList.add('sorted'); thead.children[i].dataset.dir = dir === 1 ? '▲' : '▼'; draw();
    } })));

    const filter = el('input', { type: 'text', placeholder: 'Filter…', 'aria-label': 'Filter rows' });
    filter.addEventListener('input', () => { term = filter.value.toLowerCase(); draw(); });
    const csvBtn = el('button', { class: 'btn', type: 'button', text: 'CSV', onclick: () => {
      const a = el('a', { href: URL.createObjectURL(new Blob([csvOf(columns, rows)], { type: 'text/csv' })), download: (res.title || 'result').replace(/\W+/g, '_') + '.csv' });
      a.click(); URL.revokeObjectURL(a.href);
    } });
    const copyBtn = el('button', { class: 'btn', type: 'button', text: 'Copy', onclick: async () => {
      const cell = (v) => (v === null ? '' : fmt(v).replace(/[\t\r\n]+/g, ' '));
      const tsv = [columns, ...rows].map((r) => r.map(cell).join('\t')).join('\n');
      try { await navigator.clipboard.writeText(tsv); copyBtn.textContent = 'Copied'; setTimeout(() => (copyBtn.textContent = 'Copy'), 1200); } catch { copyBtn.textContent = 'Failed'; }
    } });

    draw();
    return el('div', {},
      el('div', { class: 'result-head' }, el('b', { text: res.title || 'Result' }), count, filter, copyBtn, csvBtn),
      el('div', { class: 'tablewrap' }, el('table', {}, el('thead', {}, thead), tbody)));
  }

  function renderResult(res) {
    const box = el('div', { class: 'result' });
    if (res.columns.length === 1 && res.rows.length === 1) {
      box.append(el('div', { class: 'result-head' }, el('b', { text: res.title || 'Result' })),
        el('div', { class: 'stat' }, el('div', { class: 'v', text: res.rows[0][0] === null ? 'null' : fmt(res.rows[0][0]) }), el('div', { class: 'k', text: res.columns[0] })));
    } else if (!res.columns.length) {
      box.append(el('div', { class: 'result-head' }, el('b', { text: res.title || 'Result' }), el('small', { text: 'no columns returned' })));
    } else {
      box.append(renderTable(res));
    }
    if (res.executed) box.append(el('details', { style: 'padding:0 10px 8px' }, el('summary', { text: 'Executed' }), el('code', { class: 'sql', text: res.executed }),
      ...(res.notes || []).map((n) => el('div', { class: 'note', text: n }))));
    return box;
  }

  function renderAnswer(data) {
    const prod = data.production;
    const card = el('div', { class: 'card' });
    card.append(el('div', { class: 'meta' },
      el('span', { class: 'badge' + (prod ? ' prod' : ''), text: (prod ? '⚠ ' : '') + 'Ran on ' + data.environment.toUpperCase() }),
      el('span', { text: data.environment_reason }),
      data.rows_sent_to_llm ? el('span', { class: 'badge', style: 'background:var(--warn-bg);color:var(--warn)', text: 'AI saw rows' }) : null));
    if (data.summary) card.append(el('div', { class: 'summary' }, mdInline(data.summary)));
    (data.warnings || []).forEach((w) => card.append(el('div', { class: 'note', text: w })));
    const shown = (data.results || []).filter((r) => r.role === 'answer');
    shown.forEach((r) => card.append(renderResult(r)));
    if (!shown.length && !data.summary) card.append(el('div', { class: 'note', text: 'No result was produced.' }));
    const steps = data.steps || [];
    if (steps.length) {
      card.append(el('details', {}, el('summary', { text: `What I did (${steps.length} step${steps.length === 1 ? '' : 's'})` }),
        el('div', { class: 'steps' }, steps.map((s) => el('div', {}, `${s.status === 'ok' ? '✓' : '✗'} ${s.tool} ${JSON.stringify(s.input).slice(0, 220)}${s.detail ? ' — ' + s.detail : ''}`)))));
    }
    return card;
  }

  function showEmpty(t = active) {
    t.el.replaceChildren(el('div', { class: 'empty' }, el('h2', { text: 'Ask anything about your data' }),
      el('div', { text: 'Plain English in, safe read-only queries out. Tables, counts, schemas, lookups.' }),
      el('div', { class: 'chips' }, EXAMPLES.map((t) => el('button', { class: 'chip', type: 'button', text: t, onclick: () => { ask(t); } })))));
  }

  async function api(path, opts) {
    const r = await fetch(base + path, opts);
    let body = null; try { body = await r.json(); } catch { /* not JSON */ }
    if (!r.ok) throw new Error((body && (body.detail || body.message)) || `HTTP ${r.status}`);
    return body;
  }

  // ---- threads (in memory only: results may contain data, so nothing is persisted)
  const threads = []; let active = null, seq = 0;
  const tlist = $('tlist');

  const uid = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  let storeOk = true;
  function persist(t) {   // fire and forget; the page keeps working in memory if the store is offline
    const turns = t.turns.filter((x) => x.kind).map((x) => ({ text: x.text, kind: x.kind, answer: x.answer || null, note: x.note || null, hist: x.hist }));
    api('/api/threads/' + t.id, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title: t.title, turns }) })
      .then(() => setStore(true), () => setStore(false));
  }
  function setStore(ok) { storeOk = ok; $('storewarn').hidden = ok; }
  function userEl(t, turn) {
    return el('div', { class: 'msg-user' }, el('span', { text: turn.text }),
      el('button', { class: 'edit', type: 'button', title: 'Edit this message (removes it and everything after)', text: '✎ Edit', onclick: () => edit(t, turn) }));
  }
  const noteCard = (text, err, extra) => el('div', { class: 'card' }, el('div', { class: 'note' + (err ? ' err' : ''), text }), extra || null);
  function restore(saved) {
    const t = { id: saved.id, title: saved.title, el: el('div', { class: 'wrap' }), turns: [], busy: false, ctrl: null, state: 'idle', named: true };
    for (const x of saved.turns || []) {
      const turn = { text: x.text, kind: x.kind, answer: x.answer, note: x.note, hist: x.hist };
      turn.userEl = userEl(t, turn);
      turn.cardEl = x.kind === 'answer' && x.answer ? renderAnswer(x.answer) : noteCard(x.note || 'No result was saved.', x.kind === 'error');
      t.turns.push(turn); t.el.append(turn.userEl, turn.cardEl);
    }
    if (!t.turns.length) { t.named = false; showEmpty(t); }
    threads.push(t);
  }
  async function loadThreads() {
    try { (await api('/api/threads')).forEach(restore); setStore(true); } catch { setStore(false); }
    if (!threads.length) newThread(); else open(threads[threads.length - 1]);
  }

  function newThread() {
    const t = { id: uid(), title: 'New thread', el: el('div', { class: 'wrap' }), turns: [], busy: false, ctrl: null, state: 'idle', named: false };
    threads.push(t); showEmpty(t); open(t); q.focus(); return t;
  }
  function open(t) {
    active = t; log = t.el; main.replaceChildren(t.el); renderList(); controls(); scroll();
  }
  function renderList() {
    tlist.replaceChildren(...threads.map((t) => el('li', { class: 'th ' + t.state + (t === active ? ' active' : ''), title: t.title, onclick: () => open(t) },
      el('span', { class: 'dot' }), el('span', { class: 'tt', text: t.title }),
      el('button', { class: 'ic', type: 'button', title: 'Stop', 'aria-label': 'Stop thread', text: '■', hidden: t.busy ? null : '', onclick: (e) => { e.stopPropagation(); stop(t); } }),
      el('button', { class: 'ic', type: 'button', title: 'Delete thread', 'aria-label': 'Delete thread', text: '✕', onclick: (e) => { e.stopPropagation(); remove(t); } }))));
    tlist.querySelectorAll('[hidden=""]').forEach((b) => b.setAttribute('hidden', ''));
  }
  function controls() {
    send.textContent = active.busy ? 'Stop' : 'Ask'; send.classList.toggle('stop', active.busy);
    $('top').classList.toggle('busy', active.busy);
  }
  function stop(t) { if (t.ctrl) t.ctrl.abort(); }
  function edit(t, turn) {   // put the message back in the box; drop it and everything after it
    if (t.busy) stop(t);
    const i = t.turns.indexOf(turn); if (i < 0) return;
    t.turns.splice(i).forEach((x) => { x.userEl.remove(); x.cardEl.remove(); });
    if (!t.turns.length) { t.named = false; t.title = 'New thread'; showEmpty(t); }
    renderList(); persist(t); q.value = turn.text; q.dispatchEvent(new Event('input')); q.focus();
  }
  function remove(t) {
    stop(t); t.removed = true;
    api('/api/threads/' + t.id, { method: 'DELETE' }).catch(() => setStore(false));
    const i = threads.indexOf(t); threads.splice(i, 1);
    if (!threads.length) newThread(); else if (t === active) open(threads[Math.min(i, threads.length - 1)]); else renderList();
  }

  async function ask(text) {
    const t = active;
    text = (text ?? q.value).trim();
    if (!text || t.busy) return;
    if (t.el.querySelector('.empty')) t.el.replaceChildren();
    if (!t.named) { t.title = text.length > 38 ? text.slice(0, 38) + '…' : text; t.named = true; }
    const turn = { text, hist: null };
    const history = t.turns.slice(-5).flatMap((x) => x.hist || []);   // answered turns only
    turn.userEl = userEl(t, turn);
    const play = el('div', { class: 'play', 'aria-hidden': 'true' }); play.innerHTML = '<svg viewBox="0 0 60 44" aria-hidden="true"><path class="fur tail" d="M9 24 Q-2 14 3 6 Q8 14 14 22Z"/><rect class="fur" x="8" y="22" width="30" height="14" rx="7"/><rect class="fur leg" x="12" y="32" width="5" height="10" rx="2.5"/><rect class="fur leg b" x="30" y="32" width="5" height="10" rx="2.5"/><circle class="fur" cx="42" cy="18" r="11"/><ellipse class="fur" cx="52" cy="22" rx="7" ry="5"/><path class="ear" d="M34 10 Q30 2 37 5 Q40 8 40 12Z"/><path class="ear" d="M46 8 Q52 1 52 9 Q50 12 47 12Z"/><circle class="ink" cx="58" cy="21" r="2"/><ellipse class="ink" cx="44" cy="16" rx="1.8" ry="2.2"/><path class="tongue" d="M50 26 q2 7 4 0Z"/></svg>'; play.append(el('span', { class: 'ball' }));
    const pending = el('div', { class: 'card' }, el('span', { class: 'dots', text: 'Fetching' }), ' ',
      el('button', { class: 'btn', type: 'button', text: '■ Stop', onclick: () => stop(t) }), play);
    turn.cardEl = pending; t.turns.push(turn);
    t.el.append(turn.userEl, pending); if (t === active) scroll();
    q.value = ''; q.style.height = '';
    t.busy = true; t.state = 'running'; t.ctrl = new AbortController(); renderList(); controls();
    try {
      const data = await api('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, signal: t.ctrl.signal,
        body: JSON.stringify({ message: text, environment: $('env').value, llm_sees_rows: $('rows').checked, history }) });
      const card = renderAnswer(data); pending.replaceWith(card); turn.cardEl = card; turn.kind = 'answer'; turn.answer = data;
      turn.hist = [{ role: 'user', content: text }, { role: 'assistant', content: `[${data.environment}] ${data.summary || ''}` }]; t.state = 'idle';
    } catch (e) {
      if (e.name === 'AbortError') { t.state = 'stopped'; turn.kind = 'stopped'; turn.note = 'Stopped. (The server may finish the query in the background; it is read-only.)'; turn.cardEl = noteCard(turn.note); pending.replaceWith(turn.cardEl); }
      else { t.state = 'idle'; turn.kind = 'error'; turn.note = String(e.message || e); turn.cardEl = noteCard(turn.note, true, el('div', { class: 'meta', text: `API: ${base || location.origin}` })); pending.replaceWith(turn.cardEl); }
    } finally {
      t.busy = false; t.ctrl = null; renderList(); if (!t.removed) persist(t); if (t === active) { controls(); q.focus(); scroll(); }
    }
  }

  $('form').addEventListener('submit', (e) => { e.preventDefault(); if (active.busy) stop(active); else ask(); });
  $('newthread').addEventListener('click', newThread);
  q.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!active.busy) ask(); } });
  q.addEventListener('input', () => { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 160) + 'px'; });
  $('clear').addEventListener('click', () => { if (active.busy) return; active.turns = []; active.named = false; active.title = 'New thread'; showEmpty(); renderList(); persist(active); });
  $('api').addEventListener('click', () => {
    const v = prompt('db-dog API address (empty = same origin)', base);
    if (v !== null) { base = v.trim().replace(/\/$/, ''); store.set('dbdog.api', base); loadEnvs(); }
  });

  async function loadEnvs() {
    const sel = $('env');
    try {
      const envs = await api('/api/environments');
      sel.replaceChildren(el('option', { value: 'auto', text: 'Auto (from question)' }),
        ...envs.map((e) => el('option', { value: e.name, text: e.name + (e.production ? '  (view-only prod)' : '') })));
    } catch (e) {
      sel.replaceChildren(el('option', { value: 'auto', text: 'Auto (API not reachable)' }));
    }
  }

  loadEnvs(); loadThreads();
})();
</script>
</body>
</html>
